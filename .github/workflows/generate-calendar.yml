const puppeteer = require('puppeteer');

// Размеры под iPhone 16 / 16 Pro
const WIDTH = 1179;
const HEIGHT = 2556;

const html = `
<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  
  body { 
    background: #000000; 
    width: ${WIDTH}px; 
    height: ${HEIGHT}px; 
    display: flex; 
    flex-direction: column; 
    align-items: center; 
    justify-content: center;
    /* Используем системный шрифт Apple - он гарантированно есть на сервере рендеринга */
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    overflow: hidden;
  }
  
  .months-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 30px;
    width: 92%;
    margin-bottom: 40px;
  }

  .month {
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .month-name {
    font-size: 28px;
    color: #555;
    margin-bottom: 16px;
    font-weight: 600;
    letter-spacing: 0.5px;
    text-transform: uppercase;
  }

  .days-grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 10px;
    width: 100%;
    justify-items: center;
  }

  .day {
    width: 22px;
    height: 22px;
    border-radius: 50%;
    background: #222;
  }

  .day.past { background: #ffffff; }
  .day.today { background: #ff3b30; }
  .day.empty { background: transparent; }

  .stats {
    font-size: 42px;
    margin-top: 20px;
    display: flex;
    gap: 24px;
    align-items: baseline;
    font-weight: 500;
    letter-spacing: -0.5px;
  }
  .days-left { color: #ff3b30; }
  .percent { color: #444; font-size: 36px; }
</style>
</head>
<body>
<div class="months-grid" id="calendar"></div>
<div class="stats">
  <span class="days-left" id="daysLeft"></span>
  <span class="percent" id="percent"></span>
</div>

<script>
const monthsRu = ['Янв', 'Фев', 'Мар', 'Апр', 'Май', 'Июн', 'Июл', 'Авг', 'Сен', 'Окт', 'Ноя', 'Дек'];
const now = new Date();
const year = now.getFullYear();
const currentMonth = now.getMonth();
const currentDay = now.getDate();

const isLeap = (year % 4 === 0 && year % 100 !== 0) || (year % 400 === 0);
const daysInMonths = [31, isLeap ? 29 : 28, 31, 30, 31, 30, 31, 31, 30, 31, 30, 31];

const calendar = document.getElementById('calendar');
let totalDaysPassed = 0;
const totalDays = 365 + (isLeap ? 1 : 0);

monthsRu.forEach((monthName, monthIndex) => {
  const monthDiv = document.createElement('div');
  monthDiv.className = 'month';
  
  const nameDiv = document.createElement('div');
  nameDiv.className = 'month-name';
  nameDiv.textContent = monthName;
  monthDiv.appendChild(nameDiv);
  
  const daysGrid = document.createElement('div');
  daysGrid.className = 'days-grid';
  
  // Логика календаря: определяем день недели для 1-го числа
  const firstDayDate = new Date(year, monthIndex, 1);
  let startDay = firstDayDate.getDay(); 
  // Корректируем под русскую неделю (Пн=0 ... Вс=6)
  startDay = (startDay === 0) ? 6 : startDay - 1;

  // Добавляем пустые точки в начало
  for (let i = 0; i < startDay; i++) {
    const emptyDiv = document.createElement('div');
    emptyDiv.className = 'day empty';
    daysGrid.appendChild(emptyDiv);
  }

  // Рисуем дни
  const daysCount = daysInMonths[monthIndex];
  for (let day = 1; day <= daysCount; day++) {
    const dayDiv = document.createElement('div');
    dayDiv.className = 'day';
    
    if (monthIndex < currentMonth) {
      dayDiv.classList.add('past');
      totalDaysPassed++;
    } else if (monthIndex === currentMonth) {
      if (day < currentDay) {
        dayDiv.classList.add('past');
        totalDaysPassed++;
      } else if (day === currentDay) {
        dayDiv.classList.add('today');
        totalDaysPassed++;
      }
    }
    
    daysGrid.appendChild(dayDiv);
  }
  
  monthDiv.appendChild(daysGrid);
  calendar.appendChild(monthDiv);
});

const daysLeft = totalDays - totalDaysPassed;
const percent = ((totalDaysPassed / totalDays) * 100).toFixed(1);

document.getElementById('daysLeft').textContent = daysLeft + 'd left';
document.getElementById('percent').textContent = percent + '%';
</script>
</body>
</html>
`;

(async () => {
  const browser = await puppeteer.launch({
    args: ['--no-sandbox', '--disable-setuid-sandbox']
  });
  const page = await browser.newPage();
  
  await page.setViewport({ width: WIDTH, height: HEIGHT });
  await page.setContent(html);
  
  // Небольшая пауза для рендеринга
  await new Promise(r => setTimeout(r, 500));

  await page.screenshot({
    path: 'calendar.png',
    type: 'png',
    clip: { x: 0, y: 0, width: WIDTH, height: HEIGHT }
  });
  
  await browser.close();
  console.log('Calendar PNG generated successfully!');
})();

