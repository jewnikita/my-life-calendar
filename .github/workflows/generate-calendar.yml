const puppeteer = require('puppeteer');

const html = `<!DOCTYPE html>
<html><body style="background:#000;width:1179px;height:2556px;display:flex;align-items:center;justify-content:center;">
<div style="color:#fff;font-size:40px;font-family:sans-serif;">TEST OK</div>
</body></html>`;

(async () => {
  const browser = await puppeteer.launch({ args: ['--no-sandbox', '--disable-setuid-sandbox'] });
  const page = await browser.newPage();
  await page.setViewport({ width: 1179, height: 2556 });
  await page.setContent(html);
  await page.screenshot({ path: 'calendar.png' });
  await browser.close();
})();