name: Generate Calendar Image

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write # <-- ЭТО ДАЕТ ПРАВА НА ЗАПИСЬ ФАЙЛОВ
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }} # <-- ИСПОЛЬЗУЕМ ТОКЕН

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm install puppeteer

      - name: Generate calendar PNG
        run: node generate.js

      - name: Commit and push changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add calendar.png
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update calendar image" && git push)

